[project]
name = "hcai"
version = "0.1.0"
description = "Counterfactual CV-bias audit of a multi-agent LLM hiring pipeline"
readme = "README.md"
authors = [
    { name = "João Oliveira", email = "57497075+jdsoliveiraa@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.39",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "patsy>=1.0.3",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
hcai = "hcai.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "markdown>=3.11.3",
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "types-markdown>=3.11.3.20261108",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]

[tool.pyright]
include = ["src", "tests"]
