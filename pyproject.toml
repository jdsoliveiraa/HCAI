[project]
name = "hcai"
version = "0.1.0"
description = "Counterfactual CV-bias audit of a multi-agent LLM hiring pipeline"
readme = "README.md"
authors = [
    { name = "João Oliveira", email = "57497075+jdsoliveiraa@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
hcai = "hcai.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
