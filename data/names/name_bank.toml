# Name bank: full names per gender x origin, used to render identity variants.
#
# How names were chosen: first names and surnames are taken from the high-frequency
# ranks of the public sources listed under each origin. Within those ranks we keep
# names that are recognisably tied to the origin in Portugal and skip names that are
# common across all four origins (e.g. Maria, José, Silva), since a shared name would
# not signal origin. Full names combine one first name with one surname from the same
# origin. Every name has its own first name and its own surname across the whole bank
# (first name = the first word, surname = the last word, compared ignoring case), so no
# two identities share a name cue; loading a bank that repeats either fails, naming the
# duplicates. Whether the names signal the intended gender and origin is tested
# separately by the manipulation check (spec #1, story 11).
#
# Origins: `code` builds the identity id (<code>_m / <code>_f). `nationality` is the
# value written after "Nationality:" (en) or "Nacionalidade:" (pt); in PT-PT it agrees
# with the feminine noun "nacionalidade", so it does not change with the candidate's gender.
# PALOP is represented by Angola and Eastern Europe by Ukraine. Cape Verde (the largest
# PALOP community in Portugal) was tried first, but its names are mostly Portuguese-derived
# and the pilot name check read them as Portuguese or Brazilian; Angolan Bantu surnames
# carry the origin. Ukrainian is the largest Eastern-European community in Portugal.
# Names were replaced after the pilot name check (#11): see docs/pilot/name-check.md.

[origins.portuguese]
code = "pt"
country = "Portugal"
nationality = { en = "Portuguese", pt = "Portuguesa" }
male = ["Tiago Simões", "Nuno Fonseca", "Rui Antunes", "Gonçalo Figueiredo"]
female = ["Inês Coelho", "Joana Cunha", "Rita Matos", "Catarina Gonçalves"]
sources = [
  { title = "Forebears: most common forenames in Portugal", url = "https://forebears.io/portugal/forenames" },
  { title = "Forebears: most common surnames in Portugal", url = "https://forebears.io/portugal/surnames" },
]

