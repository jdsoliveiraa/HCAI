# Core design (spec #1): 3 roles × 3 quality levels, base CVs generated by a third-family model.
# `hcai corpus configs/core.toml` generates and freezes the corpus at corpus_dir; bump the version
# (e.g. v2) to generate a new one, or pass --force to overwrite.

[design]
roles = ["software_engineer", "nurse", "accountant"]
quality_levels = ["strong", "average", "weak"]
# Base CVs per role × quality level: 3 → 9 per role (core: about 10 per role).
base_cvs_per_role = 3
# EN and PT-PT (RQ1). The generator writes EN, then translates every job ad and base CV into PT-PT.
languages = ["en", "pt"]
# C0 baseline, C1 blinding, C2 rubric + judge + escalation. C3 (C1 + C2) is a stretch goal: add "C3" to run it.
conditions = ["C0", "C1", "C2"]
# Pipeline models, pinned in the pilot (#11 Part B, 2026-11-14; probe results in docs/pilot/check-2026-11-14.json):
# gpt-5.6-luna (proprietary) and qwen3.8-flash (open-weight), both on OpenCode Go. Both return JSON-schema output;
# chosen among the working candidates for low token use per call (Go budget). Neither is deterministic at
# temperature 0 nor honours the seed, so run-to-run variation is measured by the stability sample.
models = ["gpt-5.6-luna", "qwen3.8-flash"]
temperature = 0.0
seed = 42
corpus_dir = "../data/corpus/v1"
# Identities are every gender x origin of the bank (8). Relative to this file.
name_bank = "../data/names/name_bank.toml"

[generator]
# A third model family, never one of the audited pipeline models: gemini-4-argon (Google), pinned in the pilot.
model = "gemini-4-argon"
temperature = 0.7
# Borderline base CVs per role, by quality level: they meet every mandatory requirement, but only just.
borderline = { average = 1, weak = 1 }
# New generator calls per document (job ad, base CV or translation) per run before it is reported as failed.
# Answers cached by earlier runs replay first at no cost, so rerunning `hcai corpus` continues with fresh attempts
# for the failing documents only (ADR 0006).
max_attempts = 4

# Oversight of the rubric conditions (C2, and C3 = C1 + C2 when it is listed in [design] conditions).
# The judge checks each quoted piece of evidence; a decision is escalated to the human review queue
# (review_queue.csv) when a quote is flagged or the score is within `margin` points of the shortlist cutoff.
[oversight]
# judge_model defaults to [generator] model (the third model family).
# judge_model = "gemini-4-argon"
# "median" (the median Evaluator score of the role x language x condition x model) or a fixed score, e.g. 70.
cutoff = "median"
margin = 5

# Ranker pools. Equal-quality: one pool per base CV holding all 8 identities (the fairness tests).
# Mixed-quality: per role x language, pools of `mixed_size` distinct base CVs spread over the quality levels,
# each with one identity: the Ranker's pairwise accuracy (RQ3) is measured on these.
[pools]
equal_quality = true
mixed_quality = 2
mixed_size = 8

# Runner: retries and the stability sample (none of this changes the design).
[run]
# A malformed or failed agent call is retried this many times, then its rows are recorded as missing.
retries = 2
# Seconds before retrying a call that raised (e.g. an HTTP error), doubled on each retry.
retry_backoff = 2.0
# Stability sample: this share of the CV variants and Ranker pools is re-run `repeats` times (identical requests,
# cached apart from the results) and compared with the original answers in stability.json.
repeat_fraction = 0.05
repeats = 1
# A rate- or usage-limit answer (HTTP 429) is waited out: Retry-After, else rate_limit_backoff seconds doubling up to
# rate_limit_max_backoff. A call still limited after rate_limit_max_wait seconds stops the run cleanly
# (progress.json); rerun the same command to resume from the cache. OpenCode Go's budget is a rolling 5 h window.
rate_limit_backoff = 30
rate_limit_max_backoff = 900
rate_limit_max_wait = 21600
# HTTP read timeout in seconds. 120 s until the pilot, then 600 s (ADR 0005), now 1200 s for the full run (#12):
# qwen3.8-flash as the PT Blinder writes up to ~16k completion tokens per call (pilot: median 7,117, max 11,218),
# more than 600 s leaves room for. A timed-out call is not cached, so every rerun would wait for it again.
request_timeout = 1200
# Run guards (ADR 0005, amendment of 2026-11-23); these are the defaults.
# The first fresh answer billed outside these sources (OpenCode Go's usage.opencode.billing_source, e.g. "balance"
# once Extra Usage kicks in) is cached, then the run stops (progress.json, exit 3). [] checks nothing.
allowed_billing = ["go"]
# Failed calls in a row on one model (a call counts once however often it is retried; any answer resets) that stop
# the run (exit 3).
max_consecutive_failures = 10
# Waits before repeating a call that failed with HTTP 5xx, a timeout or a dropped connection (instead of
# retry_backoff); such a call is repeated up to max(retries, 3) times, so an outage of about 10 min is ridden out.
transient_backoff = [30, 120, 480]
# Warn when more than this share of the results rows is missing (#12 target: under 2%).
missing_target = 0.02
# Seconds between heartbeat lines in results/run.log (rows done, rate, ETA, current block); each also rewrites
# progress.json. Per-call records go to results/calls.jsonl (ADR 0005, logs amendment).
heartbeat_s = 300
# Agent calls in flight at once (ADR 0005, concurrency amendment): within each block, CV variants (Blinder ->
# Screener -> Evaluator -> judge) and Ranker pools (once their CVs are screened) run on up to this many workers.
# Requests, cache keys and results.csv are the same as with 1 (one after the other). Why 3: sequentially the run
# spent about USD 0.9/h of the Go allowance (~USD 4.5 per 5 h), and Go's rolling 5 h window allows about USD 11.
# 3 workers spend about USD 2.7/h (~USD 13.5 per 5 h), just at or over the cap late in a window: the run is about
# 3x faster while it lasts, and a limit answer then pauses every worker together (the rate-limit waits above)
# rather than failing calls. More workers would only spend longer paused. Calls take 1-3 min (qwen), so the
# workers wait on the provider, not on this machine.
concurrency = 3

# Pilot slice (`hcai run <config> --pilot`): keep the first N levels of each factor; leave a key out to keep all.
[pilot]
roles = 1
base_cvs_per_role = 1
mixed_quality = 1

# Project site (`hcai site configs/core.toml`, ADR 0010): paths relative to the project root (`root`, relative to
# this file). Every key is optional; these are the defaults.
[site]
root = ".."
notebook = "notebooks/analysis.ipynb"
report = "report/report.pdf"
results = "data/runs/core-v1"
review = "docs/pilot/cv-realism-review"
# The committed record of the name check (`hcai names`): the CSV files copied from results/names. The site reads
# it from here, since results/ is gitignored and the Pages build has only the repository; results/names is read
# only when this directory has no name check tables.
names = "docs/pilot/names"
# The human-audit export of the frozen run (`hcai reproduce`), shown on the audit page for the raters.
audit = "data/runs/core-v1/analysis/audit"
repo = "jdsoliveiraa/HCAI"

# Which provider serves each model (pipeline models, generator, judge): "opencode-go" (the OpenCode Go
# subscription, the default for any model not listed) or "openrouter" (pay per token, the fallback).
# Switching a model is this one line; ids are the provider's own, so a switch may also need the id changed.
[model_providers]
"gpt-5.6-luna" = "opencode-go"
"qwen3.8-flash" = "opencode-go"
"gemini-4-argon" = "opencode-go"

# Built-in providers (override base_url, key_env or billing here, or add another with base_url and key_env):
# [providers.opencode-go]
# base_url = "https://opencode.ai/zen/go/v1"
# key_env = "OPENCODE_API_KEY"
# [providers.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# key_env = "OPENROUTER_API_KEY"
