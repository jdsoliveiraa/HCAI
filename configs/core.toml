# Core design (spec #1): 3 roles × 3 quality levels, base CVs generated by a third-family model.
# `hcai corpus configs/core.toml` generates and freezes the corpus at corpus_dir; bump the version
# (e.g. v2) to generate a new one, or pass --force to overwrite.

[design]
roles = ["software_engineer", "nurse", "accountant"]
quality_levels = ["strong", "average", "weak"]
# Base CVs per role × quality level: 3 → 9 per role (core: about 10 per role).
base_cvs_per_role = 3
# EN and PT-PT (RQ1). The generator writes EN, then translates every job ad and base CV into PT-PT.
languages = ["en", "pt"]
# C0 baseline, C1 blinding, C2 rubric + judge + escalation. C3 (C1 + C2) is a stretch goal: add "C3" to run it.
conditions = ["C0", "C1", "C2"]
# Placeholder pipeline models (one commercial, one open-weight); the concrete ids are chosen in the pilot.
models = ["openai/gpt-4o-mini", "meta-llama/llama-3.3-70b-instruct"]
temperature = 0.0
seed = 42
corpus_dir = "../data/corpus/v1"
# Identities are every gender x origin of the bank (8). Relative to this file.
name_bank = "../data/names/name_bank.toml"

[generator]
# A third model family, never one of the audited pipeline models (placeholder until the pilot).
model = "google/gemini-2.5-flash"
temperature = 0.7
# Borderline base CVs per role, by quality level: they meet every mandatory requirement, but only just.
borderline = { average = 1, weak = 1 }

# Oversight of the rubric conditions (C2, and C3 = C1 + C2 when it is listed in [design] conditions).
# The judge checks each quoted piece of evidence; a decision is escalated to the human review queue
# (review_queue.csv) when a quote is flagged or the score is within `margin` points of the shortlist cutoff.
[oversight]
# judge_model defaults to [generator] model (the third model family).
# judge_model = "google/gemini-2.5-flash"
# "median" (the median Evaluator score of the role x language x condition x model) or a fixed score, e.g. 70.
cutoff = "median"
margin = 5

# Runner: retries and the stability sample (none of this changes the design).
[run]
# A malformed or failed agent call is retried this many times, then its rows are recorded as missing.
retries = 2
# Seconds before retrying a call that raised (e.g. an HTTP error), doubled on each retry.
retry_backoff = 2.0
# Stability sample: this share of the CV variants and Ranker pools is re-run `repeats` times (identical requests,
# cached apart from the results) and compared with the original answers in stability.json.
repeat_fraction = 0.05
repeats = 1

# Pilot slice (`hcai run <config> --pilot`): keep the first N levels of each factor; leave a key out to keep all.
[pilot]
roles = 1
base_cvs_per_role = 1
mixed_quality = 1
