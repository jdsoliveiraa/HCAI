# Thin skeleton design: 1 role, 1 hand-written base CV, 2 identities, EN, condition C0.
# Scale up by adding levels; no code changes needed.

[design]
roles = ["data_analyst"]
quality_levels = ["high"]
base_cvs_per_role = 1
languages = ["en"]
conditions = ["C0"]
# Placeholder pipeline model; the concrete ids are chosen in the pilot.
models = ["openai/gpt-4o-mini"]
temperature = 0.0
seed = 42
# Base CVs live at <corpus_dir>/<role>/<quality>/<id>.<lang>.md, job ads at <corpus_dir>/<role>/job_ad.<lang>.md.
# CV templates use $name and $nationality placeholders. Relative to this file.
corpus_dir = "../data/corpus"

[[identities]]
id = "pt_m"
gender = "male"
origin = "portuguese"
names = ["Tiago Martins"]
nationality = "Portuguese"

[[identities]]
id = "br_f"
gender = "female"
origin = "brazilian"
names = ["Ana Clara Souza"]
nationality = "Brazilian"

# Ranker pools. Equal-quality: one pool per base CV holding all its identities.
# Mixed-quality: `mixed_quality` pools per role x language of `mixed_size` distinct base CVs across the quality levels.
[pools]
equal_quality = true
mixed_quality = 0
mixed_size = 8

# Runner: retries and the stability sample (none of this changes the design).
[run]
# A malformed or failed agent call is retried this many times, then its rows are recorded as missing.
retries = 2
# Seconds before retrying a call that raised (e.g. an HTTP error), doubled on each retry.
retry_backoff = 2.0
# Stability sample: this share of the CVs and Ranker pools is re-run `repeats` times (identical requests,
# cached apart from the results) and compared with the original answers in stability.json.
repeat_fraction = 0.0  # e.g. 0.05 in a real run
repeats = 1

# Pilot slice (`hcai run <config> --pilot`): keep the first N levels of each factor; leave a key out to keep all.
[pilot]
roles = 1
base_cvs_per_role = 1
mixed_quality = 1
