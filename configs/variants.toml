# Identity x language variants of the skeleton base CV: 8 identities from the name bank
# (2 genders x 4 origins), EN and PT-PT. `hcai variants` renders and checks them;
# `hcai run` evaluates them.

[design]
roles = ["data_analyst"]
quality_levels = ["high"]
base_cvs_per_role = 1
languages = ["en", "pt"]
conditions = ["C0"]
models = ["openai/gpt-4o-mini"]
temperature = 0.0
seed = 42
corpus_dir = "../data/corpus"
# Identities are every gender x origin of the bank. Relative to this file.
name_bank = "../data/names/name_bank.toml"

# Which provider serves each model: "opencode-go" (default for unlisted models) or "openrouter" (fallback).
# Switching a model is one line. The placeholder id is an OpenRouter id until the pilot pins the models.
[model_providers]
"openai/gpt-4o-mini" = "openrouter"
